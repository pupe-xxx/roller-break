<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ROLLER BREAK</title>
  <link rel="icon" href="data:,">
  <style>:root { --accent: #ff8a50; }</style>
</head>
<body>
  <div id="app">
    <div id="hud">
      <button id="menuBtn" type="button" aria-label="Stages">☰</button>
      <span id="stageLabel"></span>
      <span id="counter"></span>
      <button id="undoBtn" type="button" aria-label="Undo">↶</button>
      <button id="retryBtn" type="button" aria-label="Retry">↻</button>
      <button id="rulesBtn" type="button" aria-label="Rules">？</button>
      <button id="muteBtn" type="button" aria-label="Sound"></button>
    </div>
    <p id="hint"></p>
    <div id="stage"><canvas id="game"></canvas></div>
    <div id="tools"></div>

    <div id="result" hidden>
      <h2 id="resultTitle"></h2>
      <div id="resultStars"></div>
      <p id="resultNote"></p>
      <div class="row">
        <button id="resultRetry" type="button"></button>
        <button id="resultNext" type="button"></button>
        <button id="resultMenu" type="button"></button>
      </div>
    </div>

    <div id="select" class="screen" hidden>
      <h1 id="title"></h1>
      <p id="howto"></p>
      <button id="selectRules" type="button"></button>
      <p id="total"></p>
      <div id="levels"></div>
    </div>

    <!-- ルールブックは、ステージ選択の上にも重ねるので、最後に置く -->
    <div id="rules" hidden>
      <h2 id="rulesTitle"></h2>
      <div id="rulesTabs">
        <button id="rulesTabStage" type="button"></button>
        <button id="rulesTabGeneral" type="button"></button>
      </div>
      <div id="rulesList"></div>
      <button id="rulesClose" type="button"></button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
